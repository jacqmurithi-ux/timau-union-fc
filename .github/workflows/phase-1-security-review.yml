name: Phase 1 security review checks

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/review-drafts/**"
      - "supabase/functions/club-admin/**"
      - "tests/phase-1-*.mjs"
      - "tests/phase-1-*.sql"
      - ".github/workflows/phase-1-security-review.yml"
  push:
    branches: ["phase-1/close-security-review-gaps"]
    paths:
      - "supabase/review-drafts/**"
      - "supabase/functions/club-admin/**"
      - "tests/phase-1-*.mjs"
      - "tests/phase-1-*.sql"
      - ".github/workflows/phase-1-security-review.yml"

permissions:
  contents: read

jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Check PostgREST smoke test syntax
        run: node --check tests/phase-1-postgrest-smoke.mjs
      - name: Type-check Edge Function without deploying
        run: deno check --no-lock supabase/functions/club-admin/index.ts
      - name: Format-check Edge Function
        run: deno fmt --check supabase/functions/club-admin/index.ts
      - name: Ensure review SQL is not placed in migrations
        run: |
          test -d supabase/review-drafts
          test ! -f supabase/migrations/phase_1_server_side_rate_limits_test.sql
          grep -q "REVIEW DRAFT ONLY" supabase/review-drafts/rate_limit_review_draft.sql
      - name: Confirm no production URL or service key in browser/test artifacts
        run: |
          ! grep -R -n "owvvimydkjsjlrmnzvdi" supabase/functions/club-admin tests/phase-1-postgrest-smoke.mjs
          ! grep -R -n "SUPABASE_SERVICE_ROLE_KEY=" tests/phase-1-postgrest-smoke.mjs
