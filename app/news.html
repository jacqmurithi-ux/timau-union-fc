<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Club news | Timau Union FC</title><link rel="icon" href="../assets/club-crest.jpg"><link rel="stylesheet" href="../styles.css"><style>.news-admin{max-width:1100px;margin:auto;padding:2rem 1rem}.news-grid{display:grid;gap:1rem}@media(min-width:800px){.news-grid{grid-template-columns:1fr 1fr}}.news-panel{padding:1rem;border:1px solid var(--border);border-radius:12px}.news-form{display:grid;gap:.75rem}.news-form label{display:grid;gap:.35rem;font-weight:650}.news-form input,.news-form textarea{width:100%;padding:.7rem;border:1px solid var(--border);border-radius:8px;font:inherit}.news-form textarea{min-height:180px}.news-item{padding:1rem 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.news-actions{display:flex;gap:.5rem;flex-wrap:wrap}.news-status{font-size:.8rem;font-weight:700}.news-note{padding:.75rem;border:1px solid var(--border);border-radius:8px}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><img class="brand-mark" src="../assets/club-crest.jpg" alt="" width="48" height="48"><span class="brand-copy"><strong>TIMAU UNION FC</strong></span></a><button id="signout" class="button button-dark" type="button">Sign out</button></div></header><main id="main" class="news-admin"><p class="eyebrow eyebrow-green">PRIVATE CLUB MANAGEMENT</p><h1>Latest news</h1><p>Media Team and Secretary can publish directly. Keep up to three items published; replace or delete older announcements as needed.</p><p id="notice" class="news-note" role="status" aria-live="polite">Checking access…</p><section id="workspace" hidden><div class="news-grid"><section class="news-panel"><h2 id="form-heading">Add news</h2><form id="news-form" class="news-form"><label>News title<input id="title" maxlength="180" minlength="3" required></label><label>Announcement<textarea id="body" maxlength="5000" minlength="3" required></textarea></label><div class="news-actions"><button class="button button-dark" type="submit">Save draft</button><button id="publish" class="button button-dark" type="button">Publish</button><button id="clear" class="button button-dark" type="button">Clear</button></div></form></section><section class="news-panel"><div class="news-actions"><h2>News items</h2><button id="refresh" class="button button-dark" type="button">Refresh</button></div><p id="count"></p><div id="records"></div></section></div></section></main><footer class="site-footer"><div class="container footer-inner"><a href="../index.html">Back to public website</a></div></footer><script type="module" src="./news.js?v=20261023-1"></script></body></html>
